<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demandes en Attente - Titre de Séjour</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-primary: #4f46e5; /* Indigo */
            --accent-success: #10b981; /* Emerald */
            --accent-info: #06b6d4;    /* Cyan */
            --accent-warning: #f59e0b; /* Amber */
            --accent-danger: #ef4444;  /* Red */
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.06) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(6, 182, 212, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 0;
        }

        .main-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Navbar glass card */
        .admin-nav {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1rem 1.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .admin-badge {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(15, 23, 42, 0.05);
            border-radius: 12px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .admin-name {
            color: var(--accent-primary);
            font-weight: 600;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .page-title {
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Search input bar */
        .search-wrapper {
            position: relative;
            margin-bottom: 2rem;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 14px;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            color: var(--text-primary);
            font-size: 0.95rem;
            width: 100%;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Table custom styling */
        .custom-table-container {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(15, 23, 42, 0.06);
        }

        .table-responsive {
            margin: 0;
        }

        .custom-table {
            width: 100%;
            margin-bottom: 0;
            color: var(--text-primary);
            border-collapse: separate;
            border-spacing: 0;
        }

        .custom-table th {
            background: rgba(15, 23, 42, 0.02);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        }

        .custom-table td {
            padding: 1.2rem 1.5rem;
            vertical-align: middle;
            border-bottom: 1px solid rgba(15, 23, 42, 0.04);
            font-size: 0.92rem;
        }

        .custom-table tbody tr {
            transition: all 0.2s ease;
        }

        .custom-table tbody tr:hover {
            background: rgba(15, 23, 42, 0.015);
        }

        .custom-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Type Badges */
        .badge-type {
            border-radius: 8px;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .badge-duplicata { background: rgba(16, 185, 129, 0.08); color: #059669; border: 1px solid rgba(16, 185, 129, 0.15); }
        .badge-transfert { background: rgba(6, 182, 212, 0.08); color: #0891b2; border: 1px solid rgba(6, 182, 212, 0.15); }
        .badge-nouveau { background: rgba(99, 102, 241, 0.08); color: var(--accent-primary); border: 1px solid rgba(99, 102, 241, 0.15); }

        /* Button Modern */
        .btn-modern {
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary-modern {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #4338ca 100%);
            border: none;
            color: white;
        }
        .btn-primary-modern:hover {
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        .btn-success-modern {
            background: linear-gradient(135deg, var(--accent-success) 0%, #059669 100%);
            border: none;
            color: white;
        }
        .btn-success-modern:hover {
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
            transform: translateY(-2px);
        }

        .btn-outline-modern {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(15, 23, 42, 0.08);
            color: var(--text-primary);
        }
        .btn-outline-modern:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(15, 23, 42, 0.15);
            color: #0f172a;
        }

        .footer-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="main-container">
    <!-- Admin Navigation Header -->
    <div class="admin-nav">
        <div class="admin-badge">
            <i class="bi bi-person-badge text-primary"></i>
            <span>Administrateur : <strong class="admin-name" sec:authentication="name">Admin</strong></span>
        </div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
            </button>
        </form>
    </div>

    <!-- Alert Success -->
    <div th:if="${param.success}" class="alert alert-success border-0 bg-success bg-opacity-10 text-success rounded-4 p-3 mb-4">
        <i class="bi bi-check-circle-fill me-2"></i>Action effectuée avec succès !
    </div>

    <!-- Main Table Card -->
    <div class="glass-card">
        <h2 class="page-title">
            <i class="bi bi-hourglass-split text-warning animate-pulse"></i>
            Demandes En Attente
        </h2>
        
        <!-- Live JS Search Input Bar -->
        <div class="search-wrapper">
            <i class="bi bi-search search-icon"></i>
            <input type="text" id="liveSearchInput" class="search-input" placeholder="Rechercher un demandeur par nom ou prénom...">
        </div>

        <div class="custom-table-container">
            <div class="table-responsive">
                <table class="custom-table" id="demandesTable">
                    <thead>
                        <tr>
                            <th style="width: 8%">ID</th>
                            <th style="width: 25%">Demandeur</th>
                            <th style="width: 20%">Type de Demande</th>
                            <th style="width: 15%">Date Demande</th>
                            <th style="width: 17%">Catégorie Visa</th>
                            <th style="width: 15%">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="demande : ${demandes}">
                            <td th:text="${'#' + demande.id}" class="text-secondary font-monospace fw-bold">#1</td>
                            <td>
                                <div class="fw-bold text-dark" th:text="${demande.demandeur?.nom} + ' ' + ${demande.demandeur?.prenom}">Nom Prénom</div>
                                <div class="text-secondary small font-monospace" th:text="${demande.demandeur?.nationalite?.libelle}">Nationalité</div>
                            </td>
                            <td>
                                <span th:if="${demande.typeDemande?.libelle == 'Duplicata'}" class="badge-type badge-duplicata">
                                    <i class="bi bi-clipboard-check"></i> <span th:text="${demande.typeDemande?.libelle}">Type</span>
                                </span>
                                <span th:if="${demande.typeDemande?.libelle == 'Transfert'}" class="badge-type badge-transfert">
                                    <i class="bi bi-arrow-left-right"></i> <span th:text="${demande.typeDemande?.libelle}">Type</span>
                                </span>
                                <span th:if="${demande.typeDemande?.libelle == 'Nouveau titre'}" class="badge-type badge-nouveau">
                                    <i class="bi bi-file-earmark-plus"></i> <span th:text="${demande.typeDemande?.libelle}">Type</span>
                                </span>
                            </td>
                            <td class="text-secondary" th:text="${#temporals.format(demande.dateDemande, 'dd/MM/yyyy HH:mm') ?: demande.dateDemande}">Date</td>
                            <td class="text-info fw-bold" th:text="${demande.categorieVisa?.libelle}">Catégorie</td>
                            <td>
                                <a th:href="@{'/demande/' + ${demande.id}}" class="btn-modern btn-primary-modern py-1 px-3 fs-7">
                                    Traiter <i class="bi bi-chevron-right fs-8"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(demandes)}" id="noResultsRow">
                            <td colspan="6" class="text-center text-secondary py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                Aucune demande en attente.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer-actions mt-4">
            <a th:href="@{/demande-visa}" class="btn-modern btn-success-modern">
                <i class="bi bi-plus-circle"></i> Créer un nouveau titre
            </a>
            <a th:href="@{/demandes}" class="btn-modern btn-outline-modern">
                <i class="bi bi-house"></i> Accueil
            </a>
            <a th:href="@{/demandes/acceptees}" class="btn-modern btn-outline-modern">
                <i class="bi bi-check-all text-success"></i> Demandes validées
            </a>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Live JS Table Search Engine -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('liveSearchInput');
        const tableRows = document.querySelectorAll('#demandesTable tbody tr:not(#noResultsRow)');
        const noResultsRow = document.getElementById('noResultsRow');

        searchInput.addEventListener('input', function() {
            const query = searchInput.value.toLowerCase().trim();
            let visibleCount = 0;

            tableRows.forEach(row => {
                const nameCell = row.cells[1].textContent.toLowerCase();
                const idCell = row.cells[0].textContent.toLowerCase();
                
                if (nameCell.includes(query) || idCell.includes(query)) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            if (visibleCount === 0 && tableRows.length > 0) {
                if (!noResultsRow) {
                    const newRow = document.createElement('tr');
                    newRow.id = 'noResultsRow';
                    newRow.innerHTML = `<td colspan="6" class="text-center text-secondary py-5"><i class="bi bi-search fs-2 d-block mb-2"></i>Aucune demande correspondante.</td>`;
                    document.querySelector('#demandesTable tbody').appendChild(newRow);
                } else {
                    noResultsRow.style.display = '';
                    noResultsRow.querySelector('td').innerHTML = `<i class="bi bi-search fs-2 d-block mb-2"></i>Aucune demande correspondante.`;
                }
            } else if (noResultsRow) {
                noResultsRow.style.display = visibleCount === 0 ? '' : 'none';
            }
        });
    });
</script>
</body>
</html>
