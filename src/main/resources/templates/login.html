<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion BackOffice - Titre de Séjour</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-primary: #4f46e5; /* Indigo */
            --accent-info: #06b6d4;    /* Cyan */
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.06) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(6, 182, 212, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.08);
            padding: 3rem 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .brand-logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #4338ca 100%);
            color: white;
            font-size: 2.2rem;
            width: 70px;
            height: 70px;
            line-height: 70px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 1rem;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
            text-align: center;
        }

        .brand-logo-section h4 {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            color: #0f172a;
        }

        .brand-logo-section p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0;
        }

        /* Modern Input Styling */
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .input-group-modern {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-control {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 14px;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            color: var(--text-primary);
            font-size: 0.95rem;
            width: 100%;
            transition: all 0.3s ease;
        }

        .input-control:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Button Modern */
        .btn-modern {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #4338ca 100%);
            border: none;
            color: white;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.9rem 1.5rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-modern:hover {
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
            transform: translateY(-2px);
        }

        /* Ambient glows */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            top: 10%;
            left: -15%;
            z-index: -1;
            filter: blur(40px);
        }
    </style>
</head>
<body>
<div class="ambient-glow"></div>
<div class="login-container">
    <div class="glass-card">
        <div class="brand-logo-section">
            <div class="logo-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4>BackOffice Visa</h4>
            <p>Espace de contrôle sécurisé</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${param.error}" class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-3 p-3 mb-4 small">
            <i class="bi bi-x-circle-fill me-2"></i>Identifiant ou mot de passe incorrect.
        </div>
        <div th:if="${param.logout}" class="alert alert-info border-0 bg-info bg-opacity-10 text-info rounded-3 p-3 mb-4 small">
            <i class="bi bi-check-circle-fill me-2"></i>Vous avez été déconnecté avec succès.
        </div>

        <!-- Connection Form -->
        <form th:action="@{/login}" method="POST">
            <div class="mb-3">
                <label class="form-label">Identifiant</label>
                <div class="input-group-modern">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" name="username" class="input-control" required autofocus placeholder="Nom d'utilisateur...">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Mot de passe</label>
                <div class="input-group-modern">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" name="password" class="input-control" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn-modern">
                Se connecter <i class="bi bi-arrow-right-short fs-5"></i>
            </button>
        </form>
    </div>
</div>
</body>
</html>
